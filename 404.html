<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>JARRAKPOS.COM - Redirecting...</title>
    <script>
      // Single Page Application SPA Redirect for GitHub Pages
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        
        // Save the intended route path into sessionStorage
        sessionStorage.setItem('SPA_REDIRECT_URL', path + search + hash);
        
        // Redirect to repository base
        var repoBase = '/datajp/';
        if (path.indexOf(repoBase) === 0) {
          window.location.replace(repoBase);
        } else {
          window.location.replace('/');
        }
      })();
    </script>
  </head>
  <body style="font-family: sans-serif; text-align: center; padding: 40px; background: #020617; color: white;">
    <p>Mengalihkan ke halaman portal Jarrakpos...</p>
  </body>
</html>
